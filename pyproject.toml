[project]
name = "agentic-tool-use"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "tavily-python>=0.5.0",
    # doc_lookup reads P2's existing Chroma store; versions match rag-service so
    # the on-disk format and node schema are readable as-is (CLAUDE.md §4).
    "chromadb>=0.5.0,<0.6.0",
    # chromadb pulls onnxruntime; cap it (matching rag-service) since 1.24+ drops
    # the Python 3.10 wheel.
    "onnxruntime>=1.14.0,<1.24.0",
    "llama-index-core>=0.12.0",
    "llama-index-vector-stores-chroma>=0.4.0",
    "llama-index-embeddings-gemini>=0.3.0",
    # doc_lookup is exposed over MCP (server + client); the rest stay direct
    # calls (CLAUDE.md §4 -- do not MCP everything).
    "mcp>=1.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    # eval harness loads its task set from tasks.yaml
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "black>=24.0.0",
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "api", "eval"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Tests that hit a live external API or need a Docker daemon are excluded from
# the default (keyless, daemon-less) run. Run them with `pytest -m live` /
# `pytest -m docker`. Mirrors rag-service's `-m "not eval"` gate.
addopts = ["-m", "not live and not docker"]
markers = [
    "live: hits a real external API (DeepSeek/Tavily/Gemini); needs keys; excluded from the default run",
    "docker: needs a running Docker daemon + the built sandbox image; excluded from the default run",
]
